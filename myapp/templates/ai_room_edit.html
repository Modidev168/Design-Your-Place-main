<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit AI Room Design</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6f8;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
        }

        .preview {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .preview img {
            display: block;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
            border-radius: 10px;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #555;
        }

        .info {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        button,
        .back-btn {
            padding: 13px 22px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            text-decoration: none;
        }

        button {
            background: #111;
            color: white;
        }

        .back-btn {
            background: #ddd;
            color: #111;
        }

        button:hover {
            opacity: 0.85;
        }

        @media (max-width: 600px) {

            .buttons {
                flex-direction: column;
            }

            button,
            .back-btn {
                text-align: center;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>✨ Edit Your AI Room</h1>

        <p>
            Tell the AI what you want to change.
        </p>

    </div>


    <!-- ORIGINAL IMAGE -->

    <div class="preview">

        <h2>Current Room</h2>

        {% if design.generated_image %}

            <img
                src="{{ design.generated_image.url }}"
                alt="Current AI Design"
            >

        {% else %}

            <img
                src="{{ design.original_image.url }}"
                alt="Original Room"
            >

        {% endif %}

    </div>


    <!-- ROOM INFORMATION -->

    <div class="info">

        <strong>Room:</strong>
        {{ design.room_type }}

        <br><br>

        <strong>Style:</strong>
        {{ design.design_style }}

        <br><br>

        <strong>Color:</strong>
        {{ design.color_theme }}

        <br><br>

        <strong>Lighting:</strong>
        {{ design.lighting }}

    </div>


    <!-- EDIT FORM -->

    <div class="form-card">

        <form method="POST">

            {% csrf_token %}

            <label for="edit_prompt">
                What would you like to change?
            </label>

            <textarea
                id="edit_prompt"
                name="edit_prompt"
                placeholder="Example: Change the sofa to white, add indoor plants and make the room brighter."
                required
            ></textarea>


            <div class="buttons">

                <button type="submit">
                    ✨ Regenerate Design
                </button>

                <a
                    href="{% url 'ai_room_result' design.id %}"
                    class="back-btn"
                >
                    ← Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
