<!DOCTYPE html>
<html lang="en">

<head>
    <title>Email Verification</title>

    <style>

        .otp-container{
            width:420px;
            margin:80px auto;
            background:#fff;
            padding:35px;
            border-radius:12px;
            box-shadow:0 0 15px rgba(0,0,0,.1);
            text-align:center;
        }

        .otp-container h2{
            margin-bottom:10px;
        }

        .otp-container p{
            color:#777;
            margin-bottom:25px;
        }

        .otp-inputs{
            display:flex;
            justify-content:space-between;
            margin-bottom:25px;
        }

        .otp-inputs input{
            width:55px;
            height:55px;
            text-align:center;
            font-size:22px;
            border:1px solid #ddd;
            border-radius:10px;
            outline:none;
        }

        .otp-inputs input:focus{
            border:2px solid #7b61ff;
        }

        .verify-btn{
            width:100%;
            border:none;
            padding:14px;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
            background:linear-gradient(90deg,#7b61ff,#ffb347);
        }

        .resend{
            margin-top:18px;
        }

        .resend a{
            text-decoration:none;
            color:#7b61ff;
            font-weight:bold;
        }

    </style>

</head>

<body>

{% include 'header.html' %}

{% if messages %}
{% for i in messages %}
<script>
alert("{{ i }}");
</script>
{% endfor %}
{% endif %}

<section class="login-sec">

<div class="otp-container">

<h2>Email Verification</h2>

<p>
We've sent a 6-digit verification code to your email.
</p>

<form method="POST">

{% csrf_token %}

<div class="otp-inputs">

<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">
<input type="text" maxlength="1" class="otp-box">

</div>

<input type="hidden" name="otp" id="otp">

<button class="verify-btn">
Verify
</button>

</form>

<div class="resend">
<a href="{% url 'forgot_password' %}">
Resend OTP
</a>
</div>

</div>

</section>

{% include 'footer.html' %}

<script>

const boxes=document.querySelectorAll(".otp-box");
const hidden=document.getElementById("otp");

boxes.forEach((box,index)=>{

box.addEventListener("keyup",(e)=>{

if(box.value.length==1 && index<boxes.length-1)
boxes[index+1].focus();

let otp="";

boxes.forEach(b=>{
otp+=b.value;
});

hidden.value=otp;

});

});

</script>

</body>

</html>
